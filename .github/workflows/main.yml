
name: SleeepX Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Save build output for inspection
        uses: actions/upload-artifact@v4
        with:
          name: SleeepX-web-build
          path: .output/
          if-no-files-found: warn
          

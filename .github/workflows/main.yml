name: SleeepX Android APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Capacitor
        run: bun add @capacitor/core @capacitor/android @capacitor/cli

      - name: Build web app
        run: bun run build

      - name: Prepare Android web assets
        id: web
        shell: bash
        run: |
          set -e
          mkdir -p .output/public

          if [ -f .output/public/_shell.html ]; then
            cp .output/public/_shell.html .output/public/index.html
          fi

          if [ ! -s .output/public/index.html ]; then
            echo "ERROR: SPA shell missing. Build output:"
            find .output -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "web_dir=.output/public" >> "$GITHUB_OUTPUT"

      - name: Configure Capacitor
        env:
          WEB_DIR: ${{ steps.web.outputs.web_dir }}
        run: |
          node -e '
          const fs = require("fs");
          const config = {
            appId: "com.zerox.sleeepx",
            appName: "SleeepX",
            webDir: process.env.WEB_DIR
          };
          fs.writeFileSync("capacitor.config.json", JSON.stringify(config, null, 2));
          '

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            bunx cap add android
          fi

      - name: Sync Android
        run: bunx cap sync android

      - name: Set Android app version 2.0.0
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'android/app/build.gradle';
          let gradle = fs.readFileSync(path, 'utf8');
          if (!/applicationId\\s+["']com\\.zerox\\.sleeepx["']/.test(gradle)) {
            throw new Error('Unexpected Android applicationId. Refusing to build an incompatible update.');
          }
          if (!/versionCode\\s+\\d+/.test(gradle) || !/versionName\\s+["'][^"']+["']/.test(gradle)) {
            throw new Error('Could not locate Android versionCode/versionName.');
          }
          gradle = gradle.replace(/versionCode\\s+\\d+/, 'versionCode 2');
          gradle = gradle.replace(/versionName\\s+["'][^"']+["']/, 'versionName "2.0.0"');
          fs.writeFileSync(path, gradle);
          console.log('SleeepX applicationId preserved; versionCode=2, versionName=2.0.0');
          NODE

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SleeepX-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

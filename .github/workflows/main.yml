name: SleeepX Android APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Capacitor
        run: bun add @capacitor/core @capacitor/android @capacitor/cli

      - name: Build web app
        run: bun run build

      - name: Find web build directory
        id: web
        shell: bash
        run: |
          set -e
          FOUND=""

          for DIR in .output/public dist build out www; do
            if [ -f "$DIR/index.html" ]; then
              FOUND="$DIR"
              break
            fi
          done

          if [ -z "$FOUND" ]; then
            FILE=$(find . \
              -path './node_modules' -prune -o \
              -path './.git' -prune -o \
              -path './android' -prune -o \
              -type f -name index.html -print -quit)

            if [ -n "$FILE" ]; then
              FOUND=$(dirname "$FILE")
            fi
          fi

          if [ -z "$FOUND" ]; then
            echo "ERROR: index.html not found"
            exit 1
          fi

          echo "web_dir=$FOUND" >> "$GITHUB_OUTPUT"
          echo "Found web directory: $FOUND"

      - name: Configure Capacitor
        env:
          WEB_DIR: ${{ steps.web.outputs.web_dir }}
        run: |
          node -e '
          const fs = require("fs");
          const config = {
            appId: "com.zerox.sleeepx",
            appName: "SleeepX",
            webDir: process.env.WEB_DIR
          };
          fs.writeFileSync("capacitor.config.json", JSON.stringify(config, null, 2));
          '

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            bunx cap add android
          fi

      - name: Sync Android
        run: bunx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SleeepX-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

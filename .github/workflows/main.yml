name: SleeepX Android APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install project dependencies
        run: bun install --frozen-lockfile

      - name: Add Capacitor Android dependencies
        run: bun add @capacitor/core @capacitor/android @capacitor/cli

      - name: Build web app
        run: bun run build
      - name: Prepare Android web assets
        run: |
          set -e
          mkdir -p .output/public
          if [ ! -f .output/public/index.html ]; then
            echo "Searching for built index.html..."
            find .output -type f -name index.html
            FOUND=$(find .output -type f -name index.html | head -n 1)
            if [ -n "$FOUND" ]; then
              cp "$FOUND" .output/public/index.html
            else
              echo "ERROR: No built index.html found"
              exit 1
            fi
          fi
      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.zerox.sleeepx",
            "appName": "SleeepX",
          "webDir": ".output/public"
          }
          EOF

      - name: Add Android platform
        run: bunx cap add android

      - name: Sync web app to Android
        run: bunx cap sync android

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload SleeepX APK
        uses: actions/upload-artifact@v4
        with:
          name: SleeepX-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

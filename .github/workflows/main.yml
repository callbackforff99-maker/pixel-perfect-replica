```yaml
name: SleeepX Android APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install project dependencies
        run: bun install --frozen-lockfile

      - name: Install Capacitor
        run: bun add @capacitor/core @capacitor/android @capacitor/cli

      - name: Build web app
        run: bun run build

      - name: Locate web build
        id: web
        shell: bash
        run: |
          set -e

          FOUND=""

          for DIR in dist build out .output/public www; do
            if [ -f "$DIR/index.html" ]; then
              FOUND="$DIR"
              break
            fi
          done

          if [ -z "$FOUND" ]; then
            FOUND=$(find . \
              -path './node_modules' -prune -o \
              -path './.git' -prune -o \
              -path './android' -prune -o \
              -type f -name index.html -print | head -n 1)

            if [ -n "$FOUND" ]; then
              FOUND=$(dirname "$FOUND")
            fi
          fi

          if [ -z "$FOUND" ] || [ ! -f "$FOUND/index.html" ]; then
            echo "ERROR: Built index.html not found!"
            echo "Available HTML files:"
            find . -name '*.html' \
              -not -path './node_modules/*' \
              -not -path './.git/*'
            exit 1
          fi

          echo "Web directory: $FOUND"
          echo "web_dir=$FOUND" >> "$GITHUB_OUTPUT"

      - name: Configure Capacitor
        run: |
          node -e '
          const fs = require("fs");
          const config = {
            appId: "com.zerox.sleeepx",
            appName: "SleeepX",
            webDir: process.env.WEB_DIR
          };
          fs.writeFileSync(
            "capacitor.config.json",
            JSON.stringify(config, null, 2)
          );
          '
        env:
          WEB_DIR: ${{ steps.web.outputs.web_dir }}

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            bunx cap add android
          fi

      - name: Sync Android
        run: bunx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload SleeepX APK
        uses: actions/upload-artifact@v4
        with:
          name: SleeepX-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
```
